name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Project Structure & Build
        run: |
          echo "Listing root files:"
          ls -la
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew tasks
          elif [ -f "app/gradlew" ]; then
            cd app && chmod +x gradlew && ./gradlew tasks
          else
            echo "Searching for gradle files in subdirectories..."
            find . -name "build.gradle*" -o -name "build.gradle.kts"
          fi

      - name: Upload Any APK Found
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/*.apk
            !**/build/outputs/apk/release/*.apk
