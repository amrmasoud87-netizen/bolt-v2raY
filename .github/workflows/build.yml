name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Build and Locate APK
        run: |
          echo "Searching for gradle files..."
          find . -name "gradlew" -exec chmod +x {} \;
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "app/gradlew" ]; then
            cd app && ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew found, installing standard gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle build || true
          fi
          
          echo "Listing all generated APKs:"
          find . -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/*.apk
            !**/build/outputs/apk/release/*.apk
