name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK using standard Gradle command
        run: |
          # تحميل أو توليد بيئة بناء خفيفة ومباشرة للمشروع
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleDebug || true
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
