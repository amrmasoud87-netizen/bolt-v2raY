name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f

      - name: Check gradlew
        run: |
          if [ -f "./gradlew" ]; then
            echo "gradlew found"
            chmod +x gradlew
            ./gradlew --version
          else
            echo "gradlew NOT found"
          fi
